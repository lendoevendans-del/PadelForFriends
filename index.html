<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PadelForFriends</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f3f6f4;color:#17251e}
header{background:#123c2b;color:white;padding:22px 18px}
nav{max-width:1000px;margin:auto;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:24px;font-weight:bold}
.hero{max-width:1000px;margin:auto;padding:45px 20px}
h1{font-size:36px;margin:0 0 12px}
.hero p{font-size:17px;line-height:1.5}
button{background:#b9ee65;color:#173323;border:0;padding:13px 20px;border-radius:8px;font-weight:bold;cursor:pointer}
button:hover{opacity:.85}
.container{max-width:1000px;margin:auto;padding:10px 20px 50px}
.panel{background:white;padding:22px;border-radius:14px;margin-bottom:25px;box-shadow:0 2px 10px #0000000c}
h2{margin-top:0}
form{display:grid;grid-template-columns:1fr 1fr;gap:14px}
label{font-weight:bold;font-size:14px}
input,select{width:100%;padding:12px;margin-top:7px;border:1px solid #ccd5ce;border-radius:7px;font-size:16px}
.full{grid-column:1/-1}
.games{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.game{background:white;border-radius:13px;padding:20px;border:1px solid #e0e8e2}
.game h3{margin-top:0;color:#123c2b}
.details{line-height:1.9;font-size:14px}
.spots{font-weight:bold;color:#276d3c;margin:12px 0}
.players{font-size:13px;color:#536258;margin-bottom:14px}
.join{width:100%}
.delete{background:#eee;color:#555;margin-top:8px;width:100%}
.empty{text-align:center;padding:30px;color:#66736a}
footer{text-align:center;padding:25px;color:#65736a;font-size:13px}
@media(max-width:600px){
form{grid-template-columns:1fr}
.full{grid-column:auto}
h1{font-size:30px}
}
</style>
</head>
<body>

<header>
<nav>
<div class="logo">🎾 PadelForFriends</div>
<div>PLAY · MEET · CONNECT</div>
</nav>
</header>

<section class="hero">
<h1>Find your next padel game!</h1>
<p>Meet new players, organise games and enjoy padel together.</p>
<button onclick="document.getElementById('create').scrollIntoView({behavior:'smooth'})">
Create a game
</button>
</section>

<main class="container">

<section class="panel" id="create">
<h2>➕ Create a new game</h2>
<form id="gameForm">
<div>
<label>Your name</label>
<input id="host" placeholder="Your name" required>
</div>
<div>
<label>Club / Location</label>
<input id="club" placeholder="Where are you playing?" required>
</div>
<div>
<label>Date</label>
<input id="date" type="date" required>
</div>
<div>
<label>Time</label>
<input id="time" type="time" required>
</div>
<div>
<label>Playing level</label>
<select id="level">
<option>Beginner</option>
<option>Intermediate</option>
<option>Advanced</option>
<option>All levels</option>
</select>
</div>
<div>
<label>Number of players</label>
<select id="capacity">
<option value="2">2 players</option>
<option value="4" selected>4 players</option>
</select>
</div>
<div class="full">
<button type="submit">Publish my game</button>
</div>
</form>
</section>

<section>
<h2>🎾 Available games</h2>
<div id="games" class="games"></div>
</section>

</main>

<footer>
PadelForFriends · Play together. Meet new friends.
</footer>

<script>
const STORAGE_KEY = "padelforFriendsGames";

function getGames(){
  try {
    return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
  } catch(e) {
    return [];
  }
}

function saveGames(games){
  localStorage.setItem(STORAGE_KEY,JSON.stringify(games));
}

function renderGames(){
  const games=getGames();
  const container=document.getElementById("games");

  if(!games.length){
    container.innerHTML='<div class="empty">No games yet. Be the first to create one! 🎾</div>';
    return;
  }

  container.innerHTML="";

  games.forEach(game=>{
    const remaining=game.capacity-game.players.length;
    const card=document.createElement("article");
    card.className="game";

    const title=document.createElement("h3");
    title.textContent="🎾 "+game.club;

    const details=document.createElement("div");
    details.className="details";
    details.textContent=
      "Host: "+game.host+
      " | Date: "+game.date+
      " | Time: "+game.time+
      " | Level: "+game.level;

    const spots=document.createElement("div");
    spots.className="spots";
    spots.textContent=remaining>0
      ? remaining+" place(s) available"
      : "Game is full";

    const players=document.createElement("div");
    players.className="players";
    players.textContent="Players: "+game.players.join(", ");

    const join=document.createElement("button");
    join.className="join";
    join.textContent="Join game";
    join.disabled=remaining<=0;
    join.style.opacity=remaining<=0?".5":"1";

    join.addEventListener("click",()=>{
      const name=prompt("Enter your name to join:");
      if(!name || !name.trim()) return;

      const current=getGames();
      const selected=current.find(g=>g.id===game.id);
      if(!selected || selected.players.length>=selected.capacity) {
        alert("Sorry, this game is already full.");
        renderGames();
        return;
      }

      if(selected.players.some(p=>p.toLowerCase()===name.trim().toLowerCase())){
        alert("You have already joined this game.");
        return;
      }

      selected.players.push(name.trim());
      saveGames(current);
      renderGames();
      alert("You have joined the game!");
    });

    const remove=document.createElement("button");
    remove.className="delete";
    remove.textContent="Delete game";
    remove.addEventListener("click",()=>{
      if(!confirm("Delete this game?")) return;
      saveGames(getGames().filter(g=>g.id!==game.id));
      renderGames();
    });

    card.append(title,details,spots,players,join,remove);
    container.appendChild(card);
  });
}

document.getElementById("gameForm").addEventListener("submit",function(e){
  e.preventDefault();

  const game={
    id:Date.now().toString(),
    host:document.getElementById("host").value.trim(),
    club:document.getElementById("club").value.trim(),
    date:document.getElementById("date").value,
    time:document.getElementById("time").value,
    level:document.getElementById("level").value,
    capacity:Number(document.getElementById("capacity").value),
    players:[document.getElementById("host").value.trim()]
  };

  if(new Date(game.date+"T"+game.time)<new Date()){
    alert("Please choose a future date and time.");
    return;
  }

  const games=getGames();
  games.push(game);
  saveGames(games);
  this.reset();
  renderGames();
  alert("Your game has been published!");
  document.getElementById("games").scrollIntoView({behavior:"smooth"});
});

renderGames();
</script>
</body>
</html>
